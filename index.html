<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swahili Net Solution — Job Cards</title>
    <script>
      // Update 52: put the saved colour mode (light, dark or custom) on the page before it is first drawn, so it never flashes the wrong
      // colours. The same rule, and the list of modes, is in src/lib/theme.js (a test checks they agree).
      var t = null;
      try { t = localStorage.getItem('sns-theme'); } catch (e) {}
      try {
        if (t !== 'light' && t !== 'dark' && t !== 'custom') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
